<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸·四季版</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="game-menu">
            <h1>植物大战僵尸·四季版</h1>
            <div class="season-select">
                <button onclick="startGame('spring')" class="season-btn spring">🌱 春天</button>
                <button onclick="startGame('summer')" class="season-btn summer">☀️ 夏天</button>
                <button onclick="startGame('autumn')" class="season-btn autumn">🍂 秋天</button>
                <button onclick="startGame('winter')" class="season-btn winter">❄️ 冬天</button>
            </div>
            <div class="volume-controls">
                <div class="volume-control">
                    <label>🎵 背景音乐</label>
                    <input type="range" id="bgmVolume" min="0" max="100" value="30" oninput="updateBGMVolume(this.value)">
                    <span id="bgmVolumeValue">30%</span>
                </div>
                <div class="volume-control">
                    <label>🔊 音效</label>
                    <input type="range" id="sfxVolume" min="0" max="100" value="50" oninput="updateSFXVolume(this.value)">
                    <span id="sfxVolumeValue">50%</span>
                </div>
            </div>
            <div class="rules-link">
                <a href="game_rules.md" target="_blank">查看游戏规则</a>
            </div>
        </div>

        <div id="plant-select-screen" class="hidden">
            <h1>选择植物</h1>
            <p>选择最多6种植物携带进入战场</p>
            <div id="available-plants">
                <div class="plant-select-card" data-plant="sunflower" onclick="togglePlantSelection('sunflower')">
                    <img src="图片和动画素材/向日葵.gif" class="plant-icon">
                    <span class="plant-cost">50</span>
                </div>
                <div class="plant-select-card" data-plant="peaShooter" onclick="togglePlantSelection('peaShooter')">
                    <img src="图片和动画素材/豌豆射手.gif" class="plant-icon">
                    <span class="plant-cost">100</span>
                </div>
                <div class="plant-select-card" data-plant="icePea" onclick="togglePlantSelection('icePea')">
                    <img src="图片和动画素材/寒冰射手.gif" class="plant-icon">
                    <span class="plant-cost">175</span>
                </div>
                <div class="plant-select-card" data-plant="doublePea" onclick="togglePlantSelection('doublePea')">
                    <img src="图片和动画素材/双发射手.gif" class="plant-icon">
                    <span class="plant-cost">200</span>
                </div>
                <div class="plant-select-card" data-plant="threepeater" onclick="togglePlantSelection('threepeater')">
                    <img src="assets/plants/threepeater.gif" class="plant-icon">
                    <span class="plant-cost">325</span>
                </div>
                <div class="plant-select-card" data-plant="firePea" onclick="togglePlantSelection('firePea')">
                    <img src="图片和动画素材/火焰豌豆射手.gif" class="plant-icon">
                    <span class="plant-cost">175</span>
                </div>
                <div class="plant-select-card" data-plant="melonPult" onclick="togglePlantSelection('melonPult')">
                    <img src="95版/reanim/Melonpult_body.png" class="plant-icon">
                    <span class="plant-cost">300</span>
                </div>
                <div class="plant-select-card" data-plant="cherryBomb" onclick="togglePlantSelection('cherryBomb')">
                    <img src="图片和动画素材/樱桃炸弹.gif" class="plant-icon">
                    <span class="plant-cost">150</span>
                </div>
                <div class="plant-select-card" data-plant="jalapeno" onclick="togglePlantSelection('jalapeno')">
                    <img src="图片和动画素材/火爆辣椒.gif" class="plant-icon">
                    <span class="plant-cost">125</span>
                </div>
                <div class="plant-select-card" data-plant="wallnut" onclick="togglePlantSelection('wallnut')">
                    <img src="图片和动画素材/坚果.png" class="plant-icon">
                    <span class="plant-cost">50</span>
                </div>
                <div class="plant-select-card" data-plant="squash" onclick="togglePlantSelection('squash')">
                    <img src="图片和动画素材/窝瓜.gif" class="plant-icon">
                    <span class="plant-cost">50</span>
                </div>
                <div class="plant-select-card" data-plant="doomShroom" onclick="togglePlantSelection('doomShroom')">
                    <img src="95版/reanim/DoomShroom_body.png" class="plant-icon">
                    <span class="plant-cost">125</span>
                </div>
                <div class="plant-select-card" data-plant="sunShroom" onclick="togglePlantSelection('sunShroom')">
                    <img src="95版/reanim/SunShroom_head.png" class="plant-icon">
                    <span class="plant-cost">25</span>
                </div>
                <div class="plant-select-card" data-plant="puffShroom" onclick="togglePlantSelection('puffShroom')">
                    <img src="95版/reanim/PuffShroom_head.png" class="plant-icon">
                    <span class="plant-cost">0</span>
                </div>
                <div class="plant-select-card" data-plant="gloomShroom" onclick="togglePlantSelection('gloomShroom')">
                    <img src="assets/plants/gloomShroom.gif" class="plant-icon">
                    <span class="plant-cost">150</span>
                </div>
                <div class="plant-select-card" data-plant="iceShroom" onclick="togglePlantSelection('iceShroom')">
                    <img src="95版/reanim/IceShroom_body.png" class="plant-icon">
                    <span class="plant-cost">75</span>
                </div>
            </div>
            <div id="selected-plants-preview">
                <h3>已选择的植物 (<span id="selected-count">0</span>/6)</h3>
                <div id="selected-plants-list"></div>
            </div>
            <button onclick="confirmPlantSelection()" id="confirm-plant-btn" disabled>开始游戏</button>
            <button onclick="backToMenu()">返回主菜单</button>
        </div>

        <div id="game-area" class="hidden">
            <div id="game-header">
                <div class="sun-container">
                    <img src="图片和动画素材/阳光.gif" class="sun-icon">
                    <span id="sun-count">150</span>
                </div>
                <div class="wave-info">
                    <span>波次: </span>
                    <span id="wave-count">1/4</span>
                </div>
                <div class="season-info" id="season-info">
                    春天
                </div>
                <button id="shovel-btn" onclick="toggleShovel()">
                    <img src="95版/images/Shovel.png" style="width:30px;height:30px;">
                </button>
                <button id="pause-btn" onclick="togglePause()">暂停</button>
                <button onclick="restartGame()">重新开始</button>
            </div>

            <div id="plant-selector">
                <div class="plant-card" data-plant="sunflower" onclick="selectPlant('sunflower')">
                    <img src="图片和动画素材/向日葵.gif" class="plant-icon">
                    <span class="plant-cost">50</span>
                    <div class="plant-cooldown" id="cd-sunflower"></div>
                </div>
                <div class="plant-card" data-plant="peaShooter" onclick="selectPlant('peaShooter')">
                    <img src="图片和动画素材/豌豆射手.gif" class="plant-icon">
                    <span class="plant-cost">100</span>
                    <div class="plant-cooldown" id="cd-peaShooter"></div>
                </div>
                <div class="plant-card" data-plant="icePea" onclick="selectPlant('icePea')">
                    <img src="图片和动画素材/寒冰射手.gif" class="plant-icon">
                    <span class="plant-cost">175</span>
                    <div class="plant-cooldown" id="cd-icePea"></div>
                </div>
                <div class="plant-card" data-plant="doublePea" onclick="selectPlant('doublePea')">
                    <img src="图片和动画素材/双发射手.gif" class="plant-icon">
                    <span class="plant-cost">200</span>
                    <div class="plant-cooldown" id="cd-doublePea"></div>
                </div>
                <div class="plant-card" data-plant="threepeater" onclick="selectPlant('threepeater')">
                    <img src="assets/plants/threepeater.gif" class="plant-icon">
                    <span class="plant-cost">325</span>
                    <div class="plant-cooldown" id="cd-threepeater"></div>
                </div>
                <div class="plant-card" data-plant="firePea" onclick="selectPlant('firePea')">
                    <img src="图片和动画素材/火焰豌豆射手.gif" class="plant-icon">
                    <span class="plant-cost">175</span>
                    <div class="plant-cooldown" id="cd-firePea"></div>
                </div>
                <div class="plant-card" data-plant="melonPult" onclick="selectPlant('melonPult')">
                    <img src="95版/reanim/Melonpult_body.png" class="plant-icon">
                    <span class="plant-cost">300</span>
                    <div class="plant-cooldown" id="cd-melonPult"></div>
                </div>
                <div class="plant-card" data-plant="cherryBomb" onclick="selectPlant('cherryBomb')">
                    <img src="图片和动画素材/樱桃炸弹.gif" class="plant-icon">
                    <span class="plant-cost">150</span>
                    <div class="plant-cooldown" id="cd-cherryBomb"></div>
                </div>
                <div class="plant-card" data-plant="jalapeno" onclick="selectPlant('jalapeno')">
                    <img src="图片和动画素材/火爆辣椒.gif" class="plant-icon">
                    <span class="plant-cost">125</span>
                    <div class="plant-cooldown" id="cd-jalapeno"></div>
                </div>
                <div class="plant-card" data-plant="wallnut" onclick="selectPlant('wallnut')">
                    <img src="图片和动画素材/坚果.png" class="plant-icon">
                    <span class="plant-cost">50</span>
                    <div class="plant-cooldown" id="cd-wallnut"></div>
                </div>
                <div class="plant-card" data-plant="squash" onclick="selectPlant('squash')">
                    <img src="图片和动画素材/窝瓜.gif" class="plant-icon">
                    <span class="plant-cost">50</span>
                    <div class="plant-cooldown" id="cd-squash"></div>
                </div>
                <div class="plant-card" data-plant="doomShroom" onclick="selectPlant('doomShroom')">
                    <img src="95版/reanim/DoomShroom_body.png" class="plant-icon">
                    <span class="plant-cost">125</span>
                    <div class="plant-cooldown" id="cd-doomShroom"></div>
                </div>
                <div class="plant-card" data-plant="sunShroom" onclick="selectPlant('sunShroom')">
                    <img src="95版/reanim/SunShroom_head.png" class="plant-icon">
                    <span class="plant-cost">25</span>
                    <div class="plant-cooldown" id="cd-sunShroom"></div>
                </div>
                <div class="plant-card" data-plant="puffShroom" onclick="selectPlant('puffShroom')">
                    <img src="95版/reanim/PuffShroom_head.png" class="plant-icon">
                    <span class="plant-cost">0</span>
                    <div class="plant-cooldown" id="cd-puffShroom"></div>
                </div>
                <div class="plant-card" data-plant="gloomShroom" onclick="selectPlant('gloomShroom')">
                    <img src="assets/plants/gloomShroom.gif" class="plant-icon">
                    <span class="plant-cost">150</span>
                    <div class="plant-cooldown" id="cd-gloomShroom"></div>
                </div>
                <div class="plant-card" data-plant="iceShroom" onclick="selectPlant('iceShroom')">
                    <img src="95版/reanim/IceShroom_body.png" class="plant-icon">
                    <span class="plant-cost">75</span>
                    <div class="plant-cooldown" id="cd-iceShroom"></div>
                </div>
            </div>

            <div id="lawn-container">
                <div id="lawn">
                    <div class="row" data-row="0">
                        <div class="cell" data-col="0" onclick="handleCellClick(0, 0)"></div>
                        <div class="cell" data-col="1" onclick="handleCellClick(0, 1)"></div>
                        <div class="cell" data-col="2" onclick="handleCellClick(0, 2)"></div>
                        <div class="cell" data-col="3" onclick="handleCellClick(0, 3)"></div>
                        <div class="cell" data-col="4" onclick="handleCellClick(0, 4)"></div>
                        <div class="cell" data-col="5" onclick="handleCellClick(0, 5)"></div>
                        <div class="cell" data-col="6" onclick="handleCellClick(0, 6)"></div>
                        <div class="cell" data-col="7" onclick="handleCellClick(0, 7)"></div>
                        <div class="cell" data-col="8" onclick="handleCellClick(0, 8)"></div>
                    </div>
                    <div class="row" data-row="1">
                        <div class="cell" data-col="0" onclick="handleCellClick(1, 0)"></div>
                        <div class="cell" data-col="1" onclick="handleCellClick(1, 1)"></div>
                        <div class="cell" data-col="2" onclick="handleCellClick(1, 2)"></div>
                        <div class="cell" data-col="3" onclick="handleCellClick(1, 3)"></div>
                        <div class="cell" data-col="4" onclick="handleCellClick(1, 4)"></div>
                        <div class="cell" data-col="5" onclick="handleCellClick(1, 5)"></div>
                        <div class="cell" data-col="6" onclick="handleCellClick(1, 6)"></div>
                        <div class="cell" data-col="7" onclick="handleCellClick(1, 7)"></div>
                        <div class="cell" data-col="8" onclick="handleCellClick(1, 8)"></div>
                    </div>
                    <div class="row" data-row="2">
                        <div class="cell" data-col="0" onclick="handleCellClick(2, 0)"></div>
                        <div class="cell" data-col="1" onclick="handleCellClick(2, 1)"></div>
                        <div class="cell" data-col="2" onclick="handleCellClick(2, 2)"></div>
                        <div class="cell" data-col="3" onclick="handleCellClick(2, 3)"></div>
                        <div class="cell" data-col="4" onclick="handleCellClick(2, 4)"></div>
                        <div class="cell" data-col="5" onclick="handleCellClick(2, 5)"></div>
                        <div class="cell" data-col="6" onclick="handleCellClick(2, 6)"></div>
                        <div class="cell" data-col="7" onclick="handleCellClick(2, 7)"></div>
                        <div class="cell" data-col="8" onclick="handleCellClick(2, 8)"></div>
                    </div>
                    <div class="row" data-row="3">
                        <div class="cell" data-col="0" onclick="handleCellClick(3, 0)"></div>
                        <div class="cell" data-col="1" onclick="handleCellClick(3, 1)"></div>
                        <div class="cell" data-col="2" onclick="handleCellClick(3, 2)"></div>
                        <div class="cell" data-col="3" onclick="handleCellClick(3, 3)"></div>
                        <div class="cell" data-col="4" onclick="handleCellClick(3, 4)"></div>
                        <div class="cell" data-col="5" onclick="handleCellClick(3, 5)"></div>
                        <div class="cell" data-col="6" onclick="handleCellClick(3, 6)"></div>
                        <div class="cell" data-col="7" onclick="handleCellClick(3, 7)"></div>
                        <div class="cell" data-col="8" onclick="handleCellClick(3, 8)"></div>
                    </div>
                    <div class="row" data-row="4">
                        <div class="cell" data-col="0" onclick="handleCellClick(4, 0)"></div>
                        <div class="cell" data-col="1" onclick="handleCellClick(4, 1)"></div>
                        <div class="cell" data-col="2" onclick="handleCellClick(4, 2)"></div>
                        <div class="cell" data-col="3" onclick="handleCellClick(4, 3)"></div>
                        <div class="cell" data-col="4" onclick="handleCellClick(4, 4)"></div>
                        <div class="cell" data-col="5" onclick="handleCellClick(4, 5)"></div>
                        <div class="cell" data-col="6" onclick="handleCellClick(4, 6)"></div>
                        <div class="cell" data-col="7" onclick="handleCellClick(4, 7)"></div>
                        <div class="cell" data-col="8" onclick="handleCellClick(4, 8)"></div>
                    </div>
                </div>
                <div class="lawnmower-row" data-row="0">
                    <img src="95版/reanim/LawnMower_body.png" class="lawnmower" id="lawnmower-0">
                </div>
                <div class="lawnmower-row" data-row="1">
                    <img src="95版/reanim/LawnMower_body.png" class="lawnmower" id="lawnmower-1">
                </div>
                <div class="lawnmower-row" data-row="2">
                    <img src="95版/reanim/LawnMower_body.png" class="lawnmower" id="lawnmower-2">
                </div>
                <div class="lawnmower-row" data-row="3">
                    <img src="95版/reanim/LawnMower_body.png" class="lawnmower" id="lawnmower-3">
                </div>
                <div class="lawnmower-row" data-row="4">
                    <img src="95版/reanim/LawnMower_body.png" class="lawnmower" id="lawnmower-4">
                </div>
            </div>

            <div id="game-over" class="hidden">
                <h2 id="game-over-title">游戏结束</h2>
                <p id="game-over-message"></p>
                <button onclick="restartGame()">重新开始</button>
                <button onclick="backToMenu()">返回主菜单</button>
            </div>

            <div id="pause-overlay" class="hidden">
                <h2>游戏暂停</h2>
                <div class="volume-controls">
                    <div class="volume-control">
                        <label>🎵 背景音乐</label>
                        <input type="range" id="pauseBGMVolume" min="0" max="100" value="30" oninput="updateBGMVolume(this.value)">
                        <span id="pauseBGMVolumeValue">30%</span>
                    </div>
                    <div class="volume-control">
                        <label>🔊 音效</label>
                        <input type="range" id="pauseSFXVolume" min="0" max="100" value="50" oninput="updateSFXVolume(this.value)">
                        <span id="pauseSFXVolumeValue">50%</span>
                    </div>
                </div>
                <button onclick="togglePause()">继续游戏</button>
                <button onclick="restartGame()">重新开始</button>
                <button onclick="backToMenu()">返回主菜单</button>
            </div>
        </div>
    </div>

    <script src="audio.js"></script>
    <script src="game.js"></script>
    <script src="plants.js"></script>
    <script src="zombies.js"></script>
    <script src="levels.js"></script>
    <script src="main.js"></script>
</body>
</html>
