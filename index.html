<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸·四季版</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // 通用图片回退：master 用 .gif/.webp，本地 zip 包里只有 .png
        // 必须在 <body> 之前注册（capture 阶段），否则首屏图片失败事件已经触发过
        document.addEventListener('error', function (e) {
            if (e.target && e.target.tagName === 'IMG') {
                var el = e.target;
                if (el.dataset.fallbackTried) return;
                var src = el.getAttribute('src') || '';
                if (/\.(gif|webp)$/i.test(src)) {
                    el.dataset.fallbackTried = '1';
                    el.src = src.replace(/\.(gif|webp)$/i, '.png');
                }
            }
        }, true);
    </script>
</head>
<body>
    <div id="game-container">
        <div id="game-menu">
            <h1>植物大战僵尸·四季版</h1>
            <div class="season-select">
                <button onclick="showPlantPicker('spring')" class="season-btn spring">🌱 春天</button>
                <button onclick="showPlantPicker('summer')" class="season-btn summer">☀️ 夏天</button>
                <button onclick="showPlantPicker('autumn')" class="season-btn autumn">🍂 秋天</button>
                <button onclick="showPlantPicker('winter')" class="season-btn winter">❄️ 冬天</button>
            </div>
            <div class="rules-link">
                <a href="game_rules.md" target="_blank">查看游戏规则</a>
            </div>
        </div>

        <!-- ===== 新增：选植物界面 ===== -->
        <div id="plant-picker-screen" class="hidden">
            <h2>选择本局植物（最多 6 种）</h2>
            <p class="picker-hint">点击植物卡牌进行选择或取消；选满 6 种后未选的卡牌将变灰</p>
            <div id="picker-grid"></div>
            <div class="picker-footer">
                <div class="picker-counter">
                    已选：<span id="picker-count">0</span> / <span id="picker-max">6</span>
                </div>
                <div class="picker-buttons">
                    <button id="picker-reset" class="picker-btn secondary">重选</button>
                    <button id="picker-back" class="picker-btn secondary">返回主菜单</button>
                    <button id="picker-confirm" class="picker-btn primary" disabled>开始战斗</button>
                </div>
            </div>
        </div>

        <div id="game-area" class="hidden">

                    <img src="95版/images/SunBank.png" class="sun-icon" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='95版/images/Sun1.gif';}">
                    <span id="sun-count">150</span>
                </div>
                <div class="wave-info">
                    <span>波次: </span>

                </div>
                <div class="season-info" id="season-info">
                    春天

                </button>
                <button id="pause-btn" onclick="togglePause()">暂停</button>
            </div>

                <div class="plant-card" data-plant="peaShooter" onclick="selectPlant('peaShooter')">

                    <span class="plant-cost">100</span>
                    <div class="plant-cooldown" id="cd-peaShooter"></div>
                </div>
                <div class="plant-card" data-plant="icePea" onclick="selectPlant('icePea')">

                    <span class="plant-cost">100</span>

                    <span class="plant-cost">125</span>

                    <span class="plant-cost">50</span>

                    <span class="plant-cost">125</span>

                <div class="plant-card" data-plant="puffShroom" onclick="selectPlant('puffShroom')">

                    <div class="plant-cooldown" id="cd-iceShroom"></div>
                </div>
            </div>

            <div id="lawn-container">

                        <div class="cell" data-col="5" onclick="handleCellClick(3, 5)"></div>

                </div>
                <div class="lawnmower-row" data-row="1">
                    <img src="95版/reanim/LawnMower_body.png" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='95版/reanim/LawnMower_body.gif';}" class="lawnmower" id="lawnmower-1">
                </div>
                <div class="lawnmower-row" data-row="2">
                    <img src="95版/reanim/LawnMower_body.png" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='95版/reanim/LawnMower_body.gif';}" class="lawnmower" id="lawnmower-2">
                </div>
                <div class="lawnmower-row" data-row="3">
                    <img src="95版/reanim/LawnMower_body.png" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='95版/reanim/LawnMower_body.gif';}" class="lawnmower" id="lawnmower-3">
                </div>
                <div class="lawnmower-row" data-row="4">
                    <img src="95版/reanim/LawnMower_body.png" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='95版/reanim/LawnMower_body.gif';}" class="lawnmower" id="lawnmower-4">
                </div>
            </div>

            <div id="game-over" class="hidden">
                <h2 id="game-over-title">游戏结束</h2>
                <p id="game-over-message"></p>
                <button onclick="backToMenu()">返回主菜单</button>
            </div>

            <div id="pause-overlay" class="hidden">
                <h2>游戏暂停</h2>
                <button onclick="togglePause()">继续游戏</button>
                <button onclick="backToMenu()">返回主菜单</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script src="plants.js"></script>
    <script src="zombies.js"></script>
    <script src="levels.js"></script>
    <script src="plant-picker.js"></script>
    <script src="main.js"></script>
</body>
</html>
